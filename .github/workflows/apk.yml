name: Generate APK

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set TAG
        run: |
          echo "version=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle | head -1)" >> $GITHUB_ENV

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Install SDK platform, build-tools and NDK r29
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865"

      - name: Signing material
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/rodemap-air.jks.enc -out upload.jks -pass pass:${{ secrets.KEYPASS }}
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          ndk.dir=$ANDROID_SDK_ROOT/ndk/29.0.14206865
          storeFile=../upload.jks
          storePassword=${{ secrets.KEYPASS }}
          keyAlias=rodemap-air
          keyPassword=${{ secrets.KEYPASS }}
          EOF

      - name: Build
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          chmod +x ./gradlew
          ./gradlew assembleNonRootRelease --stacktrace
          rm upload.jks local.properties

      - name: Publish (GitHub)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.version }}
          tag_name: v${{ env.version }}
          files: |
            app/build/outputs/apk/nonRoot/release/app-nonRoot-release.apk
